# Builds the Windows and Mac downloads on GitHub's own Windows and Mac machines, checks
# that each one starts with an empty data folder, and publishes them as a GitHub Release
# when a version tag is pushed (after updating "version" in package.json):
#   git tag v0.7.1 && git push origin v0.7.1
# "Run workflow" on the Actions tab builds and checks them without releasing; the files
# are then attached to that run.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '24.22.1'

jobs:
  test:
    name: Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            app: dist/stage/Medicus Vitae
            file: dist/*.zip
          - name: Mac
            os: macos-latest
            app: dist/stage/Medicus Vitae.app/Contents/Resources/app
            file: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run package
      - name: Check the package
        run: node scripts/smoke-test.mjs "${{ matrix.app }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.file }}
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish the release
    needs: [test, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sed "s/@VERSION@/${TAG#v}/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/* --title "Medicus Vitae ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
